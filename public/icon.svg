<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="shieldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Subtle Circuit / Radial Grid Lines -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Shield Base Glow -->
  <path d="M256 96 L376 148 V264 C376 348 256 416 256 416 C256 416 136 348 136 264 V148 Z" 
        fill="url(#shieldGlow)" filter="url(#glow)"/>

  <!-- Shield Outline -->
  <path d="M256 108 L364 156 V260 C364 336 256 398 256 398 C256 398 148 336 148 260 V156 Z" 
        fill="#0D1527" stroke="url(#accent)" stroke-width="8" stroke-linejoin="round"/>

  <!-- University Graduation Cap Motif at Top of Shield -->
  <path d="M256 160 L320 188 L256 216 L192 188 Z" fill="#38BDF8"/>
  <path d="M214 204 V232 C214 246 298 246 298 232 V204" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
  <path d="M312 196 V236" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
  <circle cx="312" cy="240" r="4" fill="#FBBF24"/>

  <!-- Verified Attendance Checkmark -->
  <path d="M208 288 L242 322 L308 256" fill="none" stroke="#34D399" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Passcode Waves / Anti-Proxy Pulse Ring -->
  <circle cx="256" cy="256" r="18" fill="#10B981" fill-opacity="0.2"/>
</svg>
